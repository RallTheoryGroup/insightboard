name: InsightBoard tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    name: InsightBoard tests
    runs-on: ubuntu-latest
    env:
      PROJECT: InsightBoard.Tests/InsightBoard.Tests.csproj
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore "$PROJECT" --locked-mode
      - name: Test and enforce coverage
        run: |
          dotnet test "$PROJECT" --configuration Release --no-restore \
            --logger "trx;LogFileName=tests.trx" \
            --results-directory "$GITHUB_WORKSPACE/TestResults/ch8" \
            -p:CollectCoverage=true -p:CoverletOutputFormat=cobertura \
            -p:CoverletOutput="$GITHUB_WORKSPACE/TestResults/ch8/coverage/" \
            -p:Threshold=80 -p:ThresholdType=line -p:ThresholdStat=total
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-evidence
          path: TestResults/ch8/
          retention-days: 7