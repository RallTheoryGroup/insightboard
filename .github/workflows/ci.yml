name: InsightBoard CI/CD
on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
env:
    DOTNET_VERSION: "10.0.x"
    BUILD_CONFIGURATION: "Release"
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: ${{ env.DOTNET_VERSION }}
            - name: Restore dependencies
              run: dotnet restore
            - name: Build
              run: dotnet build --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore
            - name: Upload build artifact
              uses: actions/upload-artifact@v4
              with:
                  name: build-output
                  path: ./src/**/bin/Release/**
                  retention-days: 30
    test:
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: ${{ env.DOTNET_VERSION }}
            - name: Restore dependencies
              run: dotnet restore
            - name: Run tests
              run: |
                  dotnet test --configuration ${{ env.BUILD_CONFIGURATION }} \
                    --collect:"XPlat Code Coverage" \
                    --results-directory ./TestResults
            - name: Upload test results
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: test-results
                  path: ./TestResults
                  retention-days: 30
    deploy:
        runs-on: ubuntu-latest
        needs: test
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        environment: production
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: ${{ env.DOTNET_VERSION }}
            - name: Build for deployment
              run: dotnet build --configuration ${{ env.BUILD_CONFIGURATION }}
            - name: Publish application
              run: |
                  dotnet publish --configuration ${{ env.BUILD_CONFIGURATION }} \
                    --output ./publish
            - name: Deploy to environment
              run: |
                  echo "Deploying InsightBoard to production..."
                  echo "Artifact directory: ./publish"
                  echo "Environment: production"
                  echo "Deployment complete."
